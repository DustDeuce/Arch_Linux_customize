# Желтая строка что висит после установки Hyprland
#autogenerated = 1

################################
#    BASIC MONITOR SETTINGS    #
################################

monitor = eDP-1, 1920x1080, 0x0, 1

#############################
#    INPUT CONFIGURATION    #
#############################

input {
    kb_layout = us, ru
    kb_variant = 
    kb_model =
    kb_options = grp:alt_shift_toggle
    kb_rules =

    follow_mouse = 1
    #sensivity = 0
    #numlock_by_default = True

    touchpad {
        natural_scroll = false
    }
}

############################
#       #
############################

general {
    gaps_in=5
    gaps_out=20
    border_size=2
    col.active_border=rgba(33ccffee)
    col.inactive_border=rgba(595959aa)
    layout=dwindle
}

############################
#    GENERAL APPEARANCE    #
############################

gestures {
    # Включаем реакцию на горизонтальный свайп тремя пальцами
    gesture = 3, horizontal, workspace

    # Дополнительные настройки для более привычного поведения (опционально)
    workspace_swipe_forever = true      # Разрешить свайп за пределы существующих рабочих столов (создавая новые)
    workspace_swipe_distance = 500      # Расстояние свайпа для срабатывания (пиксели)
    workspace_swipe_invert = false      # Обратное направление (false = свайп влево -> след. рабочее место)
    workspace_swipe_min_speed_to_force = 30  # Мин. скорость для принудительного переключения
    workspace_swipe_cancel_ratio = 0.5  # Порог отмены свайпа
}

####################
#    ANIMATIONS    #
####################

animations{
    #enable=true
    #fade_in=200
    #fade_out=200
    #move=200
    #resize=200
    #switch_workspace=200
    #switch_window=200
}

####################################
#   НАСТРОЙКИ ПРОЗРАЧНОСТИ ОКОН    #
####################################

decoration {
    # ---  ---
    # Значение 1.0 = непрозрачно, 0.0 = полностью прозрачно.
    # Рекомендую начать с 0.85 для активного окна и 0.8 для неактивных.
    active_opacity = 1
    inactive_opacity = 0.8
    fullscreen_opacity = 1.0  # На полном экране прозрачность обычно не нужна

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # --- Настройки размытия (blur) ---
    blur {
        enabled = true
        size = 3              # Радиус размытия (чем больше, тем сильнее эффект)
        passes = 1            # Качество (чем больше, тем плавнее, но тяжелее для GPU)
        ignore_opacity = true # Игнорировать прозрачность окна для слоя размытия (важно!)
        new_optimizations = true # Включает оптимизации производительности
        noise = 0.0117        # Небольшой шум для "матового" эффекта
        contrast = 0.9        # Контраст размытия
        brightness = 0.8      # Яркость размытия
        vibrancy = 0.17       # Насыщенность цветов размытия
    }
}

