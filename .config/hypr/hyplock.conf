&font = Monospace

general {
    hide_cursor = false
}

background {
    monitor = eDP-1
    path = screenshot
    blur_passes = 1
}

input-field {
    monitor = eDP-1
    size = 20%, 5%  
    outline_thickness = 3
    inner_color = rgba(0, 0, 0, 0.0)
    outer_color = rgba(33ccffee) rgba(00ff99ee) 45deg
    check_color = rgba(00ff99ee) rgba(ff6633ee) 120deg
    fail_color = rgba(ff6633ee) rgba(ff0066ee) 40deg
    font_color = rgba(220, 215, 186, 6.8)
    fade_on_empty = false
    rounding = 15
    font_family = $front
    placeholder_text = <i>Password...</i>
    fail_text = $PAMFAIL
    dots_text_format = *
    dots_size = 0.2
    dots_spacing = 0.3
    
    
    #dots_center = true
    #outer_color = rgba(0, 0, 0, 0)
    position = 700, -400
    halign = center
    valign = center
}

# ===== ВРЕМЯ =====
label {
    monitor = eDP-1
    text = $TIME
    font_size = 90
    font_family = $font
    position = -30, 0
    halign = right
    valign = top
}

# ===== ДАТА =====
label {
    monitor = eDP-1
    text = cmd[update:1000] echo "$(date +"%A, %d %B %Y")"
    font_size = 25
    font_family = $font
    position = -30, -150
    halign = right
    valign = top
}

# ===== ПОЛЬЗОВАТЕЛЬ =====
label {
    monitor = eDP-1
    text = $USER
    color = rgb(200, 200, 200)
    font_size = 65
    font_family = Inter
    position = 0, 180
    halign = center
    valign = center
}

# ===== Язык клавиатуры =====
label {
    monitor = eDP-1
    text = $LAYOUT[en, ru]
    font_size = 24
    onclick = hyprctl switchxkblayout all next
    position = 250, -20
    halign = center
    valign = center
}
